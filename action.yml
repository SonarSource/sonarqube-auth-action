name: Official SonarQube Auth
# Warning: changing name would change URL in the marketplace
description: >
  Exchange the GitHub Actions OIDC token for a short-lived SonarQube Cloud token scoped to the current repository's project.
  No stored secret required. Run it right before the SonarQube scan.

branding:
  icon: log-in
  color: green
inputs:
  sonar-region:
    description: >
      Region of the SonarQube Cloud instance: eu (default, https://sonarcloud.io) or us (https://sonarqube.us).
    required: false
  sonar-web-base-url:
    description: >
      Advanced, for testing only: web URL of a custom SonarQube Cloud environment.
      Requires sonar-api-base-url, and cannot be combined with sonar-region.
    required: false
  sonar-api-base-url:
    description: >
      Advanced, for testing only: API base URL of a custom SonarQube Cloud environment.
      Requires sonar-web-base-url, and cannot be combined with sonar-region.
    required: false
  export-env:
    description: >
      Export the token as the SONAR_TOKEN environment variable for the next steps of the job, together with SONAR_REGION for the us region,
      or SONAR_SCANNER_SONARCLOUD_URL and SONAR_SCANNER_API_BASE_URL for custom URLs.
      This is what the SonarQube scan action and the SonarScanners read. Set to false to only use the outputs.
    required: false
    default: "true"
outputs:
  sonar-token:
    description: Short-lived, project-scoped SonarQube token. Masked in the logs.
  organization:
    description: Key of the SonarQube Cloud organization that owns the project
  project-key:
    description: Key of the SonarQube Cloud project bound to the repository
runs:
  using: node24
  main: dist/index.js
