name: Official SonarQube Auth
# Warning: changing name would change URL in the marketplace
description: >
  Exchange the GitHub Actions OIDC token for a short-lived SonarQube Cloud token scoped to a project bound to the current repository.
  No stored secret required. Run it right before the SonarQube scan.

branding:
  icon: log-in
  color: green
inputs:
  sonar-region:
    description: >
      Region of the SonarQube Cloud instance: eu (default, https://sonarcloud.io) or us (https://sonarqube.us).
    required: false
  project-key:
    description: >
      Key of the SonarQube Cloud project to get a token for. Required when the repository is bound to several projects (monorepo),
      to select one of them. Optional otherwise. Must be a project bound to the current repository.
    required: false
  sonar-api-base-url:
    description: >
      Advanced, for testing on non-production environments only: API base URL of the SonarQube Cloud environment to exchange the token with.
      Requires oidc-audience, and cannot be combined with sonar-region. Configure the scanner for the same environment separately.
    required: false
  oidc-audience:
    description: >
      Advanced, for testing on non-production environments only: audience of the GitHub OIDC token, as expected by the environment
      of sonar-api-base-url. Requires sonar-api-base-url.
    required: false
  export-env:
    description: >
      Export the token as the SONAR_TOKEN environment variable for the next steps of the job, together with SONAR_REGION for the us region.
      This is what the SonarQube scan action and the SonarScanners read. Set to false to only use the outputs.
    required: false
    default: "true"
outputs:
  sonar-token:
    description: Short-lived, project-scoped SonarQube token. Masked in the logs.
  organization:
    description: Key of the SonarQube Cloud organization that owns the project
  project-key:
    description: Key of the SonarQube Cloud project bound to the repository
  sonar-region:
    description: >
      Value for the SONAR_REGION environment variable or the sonar.region property of the scanner:
      us for the us region, empty for the eu region (the scanner default) and for sonar-api-base-url.
runs:
  using: node24
  main: dist/index.js
