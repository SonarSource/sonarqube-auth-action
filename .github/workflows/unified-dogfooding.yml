name: Unified Dogfooding scans

# PREREQUISITES:
# This workflow requires your repository to be onboarded to multiple SonarQube platforms
# and have access to specific Vault secrets for authentication.
#
# Required Platform Onboarding:
# - Next (SonarQube Next platform)
# - SonarQube Cloud EU
# - SonarQube Cloud US
# ℹ️  Use the SPEED "Onboard to SonarQube" action to onboard your repository to these platforms
#
# Required Vault Secrets (can be requested through SPEED):
# - development/kv/data/iris: {}
# - development/kv/data/next: {}
# - development/kv/data/sonarcloud: {}
# - development/kv/data/sonarqube-us: {}
#
# 📖 Documentation: https://xtranet-sonarsource.atlassian.net/wiki/spaces/Platform/pages/4285333581/GitHub+CI+CD+Starting+Guide+-+GitHub#Unified-Platform-Dogfooding-(Shadow-Scanning)

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: github-ubuntu-latest-s
    name: Build
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: SonarSource/ci-github-actions/build-npm@v1
        with:
          run-shadow-scans: true
          deploy: false

      - name: Run IRIS Analysis
        uses: SonarSource/unified-dogfooding-actions/run-iris@master
        with:
          primary_project_key: "SonarSource_sonarqube-auth-action"
          primary_platform: "SQC-EU"  # Options: SQC-EU, SQC-US, Next
          shadow1_project_key: "SonarSource_sonarqube-auth-action"
          shadow1_platform: "Next"  # Options: SQC-EU, SQC-US, Next
          shadow2_project_key: "SonarSource_sonarqube-auth-action"
          shadow2_platform: "SQC-US"  # Options: SQC-EU, SQC-US, Next
